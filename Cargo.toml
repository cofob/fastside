[workspace]
members = [
  "fastside",
  "fastside-actualizer",
  "fastside-cloudflare",
  "fastside-shared",
  "fastside-captcha-solver",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"

[workspace.dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["json"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
config = { version = "0.15.27", default-features = false }
console_error_panic_hook = "0.1.7"
cookie = "0.18.2"
fastrand = "2.5.0"
futures = "0.3.34"
getrandom = { version = "0.2.17", features = ["js"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
ipnet = "2.12.2"
log = "0.4.35"
pretty_env_logger = "0.5.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false }
ring = { version = "0.17.14", default-features = false }
rustls = { version = "0.23.46", default-features = false }
rustls-pki-types = { version = "1.16.0", features = ["web"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false }
tower-service = "0.3.3"
url = { version = "2.5.8", features = ["serde"] }
urlencoding = "2.1.3"
wasm-bindgen = "0.2.130"
webpki-roots = "1.0.12"
worker = { version = "0.9.0", default-features = false, features = ["http"] }
yaml_serde = "0.10.7"

[profile.release]
overflow-checks = true
incremental = false
codegen-units = 1
opt-level = 3
debug = "full"
strip = true
lto = true
