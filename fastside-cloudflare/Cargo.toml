[package]
name = "fastside-cloudflare"
description = "Cloudflare Workers adapter for Fastside."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
fastside = { path = "../fastside", default-features = false }
fastside-shared = { path = "../fastside-shared", default-features = false }

async-trait.workspace = true
axum.workspace = true
console_error_panic_hook.workspace = true
fastrand = { workspace = true, features = ["js"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["wasm-bindgen"] }
tokio = { workspace = true, features = ["sync"] }
tower-service.workspace = true
url.workspace = true
worker.workspace = true
